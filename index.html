<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة سيمو ومريم</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            padding: 50px;
            color: #fff;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { font-size: 18px; }
        footer {
            margin-top: 50px;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>❤️ مرحباً بكما في لعبة سيمو ومريم ❤️</h1>
        <p>استعدوا لخوض تحديات رومانسية ممتعة!</p>
    </div>

    <footer>
        تطبيق ليالي تجمع جوج قلوب - من تصميم وتطوير سيمو خصيصاً لمريم ❤️
    </footer>
</body>
</html>
