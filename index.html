<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة سيمو ومريم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #d63384;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        .btn:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
        .heart {
            font-size: 50px;
            color: #ff4757;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="heart">❤️</div>
        <h1>لعبة سيمو ومريم</h1>
        <p id="question-text">مرحباً بكم في أجمل تحدي رومانسي! واش مستعدين تبداو اللعبة؟</p>
        <button class="btn" id="action-btn" onclick="nextStep()">ابدأ التحدي</button>
    </div>

    <script>
        let step = 0;
        const questions = [
            "السؤال الأول: شكون كيبغي الآخر كتر، سيمو ولا مريم؟ 😉",
            "التحدي الثاني: مريم خصها تعترف بشي حاجة زوينة كتعجبها في سيمو! 🌸",
            "التحدي الثالث: اعطي شي بوسة افتراضية في الهواء لبعضياتكم دابا! 😘",
            "مبروك عليكم! كملتوا التحديات بنجاح، حبكم دائم لا ينتهي ❤️"
        ];

        function nextStep() {
            step++;
            const textElement = document.getElementById("question-text");
            const btnElement = document.getElementById("action-btn");

            if (step < questions.length) {
                textElement.innerText = questions[step];
                if (step === questions.length - 1) {
                    btnElement.innerText = "إنهاء اللعبة ❤️";
                }
            } else {
                textElement.innerText = "تهانينا! أنتما أحسن ثنائي ❤️🔥";
                btnElement.style.display = "none";
            }
        }
    </script>

</body>
</html>
